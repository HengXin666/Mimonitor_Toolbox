name: Build AppImage (Arch Linux)

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    env:
      APPIMAGE_NAME: mimonitor-toolbox-x86_64.AppImage
    steps:
      - name: Install build dependencies
        run: |
          # 构建机需要完整的 Qt 图形依赖链：构建脚本会把 ldd 到的外部库
          # 复制进 AppImage。容器里若缺这些库，ldd 也找不到，产物就会在
          # 目标机上缺依赖（例如 libxkbcommon.so.0）。
          pacman -Syu --noconfirm --needed \
            base-devel git python rsync curl file binutils \
            zsync squashfs-tools imagemagick \
            mesa libglvnd libxkbcommon libxkbcommon-x11 \
            libxcb xcb-util xcb-util-cursor xcb-util-wm xcb-util-image \
            xcb-util-keysyms xcb-util-renderutil \
            wayland wayland-protocols \
            fontconfig freetype2 glib2 dbus expat zlib zstd \
            libpng brotli bzip2 krb5 systemd-libs libffi

      - uses: actions/checkout@v4

      - name: Build AppImage
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          ./packaging/appimage/build-appimage.sh "$GITHUB_WORKSPACE/dist-appimage"

      - name: Verify AppImage runs
        run: |
          set -euo pipefail
          IMG="dist-appimage/$APPIMAGE_NAME"
          if [ ! -f "$IMG" ]; then
            echo "未找到构建产物: $IMG"; ls -la dist-appimage; exit 1
          fi
          echo "Testing: $IMG"
          chmod +x "$IMG"
          # 容器内没有 FUSE，用 --appimage-extract-and-run 解包运行
          # 能起来并存活 8 秒（timeout 返回 124）即算通过
          export QT_QPA_PLATFORM=offscreen
          export MIMONITOR_SETTINGS_PATH=/tmp/smoke/config.json
          code=0
          timeout 8 "$IMG" --appimage-extract-and-run > /tmp/smoke.log 2>&1 || code=$?
          echo "exit=$code"
          tail -30 /tmp/smoke.log || true
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "AppImage 启动失败 (exit=$code)"; exit 1
          fi
          echo "冒烟测试通过（进程正常存活）"

      - name: Verify Linux network enumeration
        run: |
          set -euo pipefail
          # 校验 Linux 网卡枚举代码确实被打进包里（不是靠系统 Python）
          IMG="dist-appimage/$APPIMAGE_NAME"
          "$IMG" --appimage-extract > /dev/null 2>&1
          SRC="squashfs-root/usr/lib/mimonitor-toolbox/mimonitor_toolbox/network_scan.py"
          grep -q "enumerate_linux_adapter_addresses" "$SRC"
          echo "Linux 网卡枚举代码已打包 ✓"
          rm -rf squashfs-root

      - name: Show size
        run: |
          ls -lh "dist-appimage/$APPIMAGE_NAME"
          echo "大小: $(du -h "dist-appimage/$APPIMAGE_NAME" | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimonitor-toolbox-appimage
          path: dist-appimage/mimonitor-toolbox-x86_64.AppImage
          if-no-files-found: error
          retention-days: 90

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-appimage/mimonitor-toolbox-x86_64.AppImage
          generate_release_notes: true
